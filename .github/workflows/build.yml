name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  test:
    name: Typecheck, test & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
      # Catches bundling errors (bad imports, missing assets) without a native build.
      - run: npx expo export --platform android --output-dir /tmp/export

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      # The release build is signed with the debug key, so it installs
      # directly as a sideloaded APK.
      - name: Build release APK
        working-directory: android
        # Maven Central occasionally fails to serve a dependency (it happened
        # once with kotlin-stdlib); wait and retry before giving up.
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Gradle build failed (attempt $attempt); retrying in 60s..."
            sleep 60
          done
          exit 1
      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ForeheadFrenzy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ForeheadFrenzy-Android
          path: dist/ForeheadFrenzy.apk

  ios:
    name: iOS (.ipa)
    needs: test
    runs-on: macos-latest
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios

      - name: Build .app (unsigned)
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild             -workspace "$WORKSPACE"             -scheme "$SCHEME"             -configuration Release             -sdk iphoneos             -destination generic/platform=iOS             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build | tail -n 40
          APP_PATH="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP_NAME=$(basename "$APP_PATH")" >> "$GITHUB_ENV"

      - name: Package unsigned .ipa
        run: |
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist && zip -qry ForeheadFrenzy-unsigned.ipa Payload

      # Runs only when the signing secrets are set (see README).
      - name: Sign .ipa with your certificate
        if: env.IOS_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"
          KEYCHAIN="$WORK/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          # Temporary keychain holding the certificate.
          echo "$IOS_P12_BASE64" | base64 --decode > "$WORK/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$WORK/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"

          # Entitlements and bundle ID come from the provisioning profile.
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$WORK/profile.mobileprovision"
          security cms -D -i "$WORK/profile.mobileprovision" > "$WORK/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$WORK/profile.plist" > "$WORK/entitlements.plist"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$WORK/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$WORK/profile.plist")"
          PROFILE_BUNDLE_ID="${APP_ID#"$TEAM_ID."}"

          rm -rf signed && mkdir -p signed/Payload
          cp -R "dist/Payload/$APP_NAME" signed/Payload/
          APP="signed/Payload/$APP_NAME"
          if [[ "$PROFILE_BUNDLE_ID" == *"*"* ]]; then
            # Wildcard profile: keep the app's bundle ID.
            BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            /usr/libexec/PlistBuddy -c "Set :application-identifier $TEAM_ID.$BUNDLE_ID" "$WORK/entitlements.plist"
          else
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $PROFILE_BUNDLE_ID" "$APP/Info.plist"
          fi
          cp "$WORK/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Sign embedded frameworks first, then the app itself.
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign "$IDENTITY" {} \;
          fi
          codesign --force --sign "$IDENTITY" --entitlements "$WORK/entitlements.plist" "$APP"
          codesign --verify --deep --strict "$APP"

          cd signed && zip -qry ../dist/ForeheadFrenzy.ipa Payload
          security delete-keychain "$KEYCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: ForeheadFrenzy-iOS
          path: dist/*.ipa
